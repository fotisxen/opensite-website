<!doctype html>
<html lang="el" class="notes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fbfaf7">
<title>Κατάστημα · Style Boutique</title>
<meta name="description" content="Ζακέτες, πανωφόρια, φορέματα και τσάντες από το Style Boutique στη Γλυφάδα. Αποστολές σε Ελλάδα και Κύπρο.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script>(function(){var h=document.documentElement;try{var q=new URLSearchParams(location.search);if(q.has("clean")||localStorage.getItem("sb-notes")==="off")h.classList.remove("notes");if(q.has("clean"))h.classList.add("clean");}catch(e){}})();</script>
<link rel="stylesheet" href="sb.css">
</head>
<body data-page="shop">
<header class="phead"><div class="wrap">
  <span class="eyebrow">Κατάστημα</span>
  <h1 id="shopTitle">Fall 2026 Collection</h1>
  <p class="lead">Όλα τα κομμάτια της σεζόν με τις τιμές τους. Διάλεξε χρώμα και μέγεθος και βάλ' τα στο καλάθι — χωρίς DM και χωρίς αναμονή για απάντηση.</p>
</div></header>

<section id="shop" style="padding-top:clamp(24px,3vw,38px)"><div class="wrap">
 <div class="shop-grid">
  <aside class="filters">
    <div class="f-block"><h4>Κατηγορία</h4><div class="chips" id="fCats"></div></div>
    <div class="f-block"><h4>Συλλογή</h4><div class="chips" id="fMoods"></div></div>
    <div class="f-block"><h4>Μέγεθος</h4><div class="chips sz-chips" id="fSizes"></div></div>
    <div class="f-block"><h4>Χρώμα</h4><div class="col-chips" id="fCols"></div></div>
    <div class="f-block"><h4>Τιμή <span id="fMaxV" class="small"></span></h4><input type="range" id="fMax"></div>
    <div class="f-block"><label class="sw"><input type="checkbox" id="fSale"> Μόνο προσφορές</label></div>
    <button type="button" id="fClear">Καθαρισμός φίλτρων</button>
    <button class="btn btn-acc" id="fDone" type="button">Δες τα αποτελέσματα</button>
  </aside>
  <div>
   <div class="shop-bar">
     <span class="count" id="count"></span>
     <div class="f-bar"><button class="btn btn-ghost" id="fBtn" type="button">Φίλτρα <span id="fBtnN"></span></button></div>
     <div class="sort-wrap"><label for="sort">Ταξινόμηση</label>
       <select id="sort"><option value="new">Νεότερα</option><option value="lo">Τιμή ↑</option><option value="hi">Τιμή ↓</option><option value="sale">Μεγαλύτερη έκπτωση</option></select></div>
   </div>
   <div class="grid" id="grid"></div>
   <p class="small ph" data-note="Ο κατάλογος γεμίζει με τα δικά σας κομμάτια — εσείς τα ανεβάζετε από το κινητό" style="margin-top:30px">Δείγμα καταλόγου από τις φωτογραφίες του Instagram σας.</p>
  </div>
 </div>
</div></section>
<script src="sb.js"></script>
</body>
</html>
