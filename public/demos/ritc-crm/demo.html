<!doctype html>
<html lang="el" class="notes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RITC Studio · back-office (δείγμα)</title>
<style>
  :root {
    --ink:#2E2B29; --ink-2:#4a4542; --muted:#857c74; --cream:#F4EFE9; --paper:#fffaf3; --card:#ffffff;
    --line:#e7dfd5; --gold:#C9A86A; --gold-2:#D9BC85; --gold-soft:#f3e9d6; --fuchsia:#ff00a8; --coral:#f16d70;
    --lav:#ecdef6; --butter:#ffedb7; --blush:#ffdddd; --ok:#2f8a57; --ok-soft:#e1f2e7; --warn:#b7791f; --warn-soft:#fdf0d5;
    --bad:#c23b4a; --bad-soft:#fbe2e5; --plum:#351334;
    --ff: Manrope, Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--ff); color: var(--ink); background: var(--cream); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  .ribbon { background: #1d1b1a; color: #e9dcc3; font-size: 12.5px; text-align: center; padding: 6px 12px; letter-spacing: .2px; }
  .ribbon b { color: var(--gold); font-weight: 700; }
  .clean .ribbon { display: none; }

  /* layout */
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  aside { background: var(--ink); color: var(--cream); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px; display: flex; flex-direction: column; }
  .logo { font-family: Georgia, "Times New Roman", serif; font-size: 30px; letter-spacing: 9px; color: var(--cream); padding: 0 10px; line-height: 1; }
  .logo-sub { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); padding: 6px 10px 20px; }
  nav a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: #d9d0c5; font-weight: 600; font-size: 14.5px; margin-bottom: 2px; cursor: pointer; }
  nav a svg { width: 19px; height: 19px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  nav a:hover { background: rgba(244,239,233,.07); color: #fff; }
  nav a.on { background: var(--gold); color: var(--ink); }
  nav a .cnt { margin-left: auto; background: var(--coral); color: #fff; border-radius: 999px; font-size: 11.5px; padding: 1px 7px; }
  nav a.on .cnt { background: var(--ink); }
  .side-foot { margin-top: auto; padding: 16px 10px 0; font-size: 12px; color: #a99f94; border-top: 1px solid rgba(244,239,233,.1); }
  .side-foot .me { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: var(--cream); font-weight: 600; font-size: 13.5px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--lav); color: var(--plum); font-weight: 800; font-size: 13px; flex: none; }
  .linkbtn { background: none; border: 0; color: var(--gold); cursor: pointer; padding: 0; font-weight: 700; font-size: 12.5px; }

  .main { min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 30; background: rgba(244,239,233,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topbar-in { display: flex; align-items: center; gap: 12px; padding: 12px 28px; }
  .burger { display: none; background: var(--ink); color: var(--cream); border: 0; border-radius: 10px; width: 42px; height: 42px; cursor: pointer; }
  .burger svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .mlogo { display: none; font-family: Georgia, serif; letter-spacing: 6px; font-size: 21px; }
  .crumb { font-weight: 800; font-size: 19px; }
  .crumb small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .sp { flex: 1; }
  .gsearch { position: relative; width: min(340px, 34vw); }
  .gsearch input { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 9px 14px 9px 36px; outline: none; }
  .gsearch input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .gsearch svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
  .gres { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 40px rgba(46,43,41,.16); overflow: hidden; display: none; max-height: 60vh; overflow-y: auto; }
  .gres.open { display: block; }
  .gres .gh { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); padding: 10px 14px 4px; }
  .gres button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 14px; cursor: pointer; }
  .gres button:hover { background: var(--cream); }
  .gres button small { color: var(--muted); }
  .sample-chip { background: var(--butter); color: #6b4e00; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }

  .view { padding: 22px 28px 60px; max-width: 1360px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.3px; }
  h2 { font-size: 16.5px; margin: 0; letter-spacing: -.1px; }
  .lead { color: var(--muted); margin: 0 0 16px; }
  .muted { color: var(--muted); }
  .note { background: var(--lav); color: var(--plum); border-radius: 14px; padding: 11px 14px; font-size: 13.5px; margin: 0 0 16px; display: flex; gap: 10px; align-items: flex-start; }
  .note b { font-weight: 800; }
  html:not(.notes) .note { display: none; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .grid { display: grid; gap: 16px; }
  .g-kpi { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .g-2 { grid-template-columns: 1.6fr 1fr; }
  .g-2e { grid-template-columns: 1fr 1fr; }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .kpi .lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .8px; }
  .kpi .val { font-size: 26px; font-weight: 800; letter-spacing: -.6px; margin: 4px 0 2px; white-space: nowrap; }
  .kpi .dl { font-size: 12.5px; font-weight: 700; }
  .up { color: var(--ok); } .down { color: var(--bad); } .flat { color: var(--muted); }
  .kpi.dark { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .kpi.dark .lbl { color: var(--gold-2); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .chip.on { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; cursor: pointer; font-size: 14px; min-height: 42px; white-space: nowrap; }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .btn.pri { background: var(--ink); color: var(--cream); }
  .btn.pri:hover { background: #45403c; }
  .btn.gold { background: var(--gold); color: var(--ink); }
  .btn.ghost { background: var(--card); border: 1px solid var(--line); }
  .btn.sm { min-height: 34px; padding: 6px 11px; font-size: 13px; border-radius: 10px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filters input[type=search], .filters select, .field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 12px; min-height: 40px; outline: none; }
  .filters input[type=search] { min-width: 230px; flex: 1 1 230px; max-width: 360px; }
  .filters input:focus, .filters select:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .tog { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .tog input { accent-color: var(--ink); width: 16px; height: 16px; }
  .sum { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
  .sum b { color: var(--ink); }

  /* tables */
  .tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; padding: 11px 14px; background: var(--paper); border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.t td { padding: 11px 14px; border-bottom: 1px solid #f1ebe3; vertical-align: middle; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t tbody tr.click { cursor: pointer; }
  table.t tbody tr.click:hover td { background: #fbf7f1; }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .nowrap { white-space: nowrap; }
  .strong { font-weight: 700; }
  .more { display: flex; justify-content: center; padding: 14px; }

  .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .b-new { background: var(--lav); color: var(--plum); }
  .b-prod { background: var(--butter); color: #6b4e00; }
  .b-ready { background: #dff0ff; color: #1d4f80; }
  .b-ship { background: var(--gold-soft); color: #7a5a1c; }
  .b-done { background: var(--ok-soft); color: var(--ok); }
  .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-grey { background: #efebe6; color: var(--ink-2); }
  .b-vip { background: var(--ink); color: var(--gold-2); }
  .b-sale { background: #ffe0f4; color: #b0007a; }

  .sw { display: inline-block; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(46,43,41,.18); vertical-align: middle; flex: none; }
  .pname { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .pname div { min-width: 0; }
  td.first .pname { min-width: 230px; }
  .pname small { display: block; color: var(--muted); font-size: 12px; }

  /* size grid */
  .sz { display: inline-grid; place-items: center; min-width: 34px; height: 30px; border-radius: 8px; font-weight: 700; font-size: 13px; background: var(--ok-soft); color: var(--ok); font-variant-numeric: tabular-nums; }
  .sz.low { background: var(--warn-soft); color: var(--warn); }
  .sz.zero { background: var(--bad-soft); color: var(--bad); }
  .sz.mto { background: var(--lav); color: var(--plum); }
  .sz.mto0 { background: #f3eee8; color: #b3a99e; }
  .sz.na { background: transparent; color: #d4ccc2; }
  .sz-h { text-align: center !important; }
  td.szc { text-align: center; padding-left: 4px !important; padding-right: 4px !important; }

  /* charts */
  svg.ch { width: 100%; height: auto; display: block; overflow: visible; }
  svg.ch text { font-family: var(--ff); fill: var(--muted); font-size: 11px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .hbars { display: grid; gap: 9px; }
  .hb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; font-size: 13.5px; }
  .hb .bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: #f1ebe3; overflow: hidden; }
  .hb .bar span { display: block; height: 100%; border-radius: 99px; background: var(--gold); }
  .hb .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
  .donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .donut-wrap svg { width: 170px; flex: none; }
  .dleg { display: grid; gap: 8px; font-size: 13.5px; flex: 1; min-width: 160px; }
  .dleg div { display: flex; align-items: center; gap: 8px; }
  .dleg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .dleg b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--cream); font-size: 12.5px; padding: 8px 10px; border-radius: 10px; z-index: 100; display: none; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .tip b { color: var(--gold-2); }

  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); font-size: 13.5px; cursor: pointer; }
  .alert:hover { border-color: var(--gold); }
  .alert .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; }

  /* kanban */
  .kanban { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .col { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 10px; min-width: 0; }
  .col-h { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 10px; font-weight: 800; font-size: 13.5px; }
  .col-h span { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .kc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
  .kc.late { border-left: 4px solid var(--warn); }
  .kc.vlate { border-left: 4px solid var(--bad); }
  .kc .top { display: flex; justify-content: space-between; gap: 6px; font-weight: 800; font-size: 12.5px; }
  .kc .it { display: flex; gap: 8px; align-items: center; margin: 7px 0; }
  .kc .ft { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .kc .nx { background: var(--ink); color: var(--cream); border: 0; border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .kc .more-k { color: var(--muted); font-size: 12px; text-align: center; padding: 4px; }
  .steps { display: flex; gap: 4px; margin: 10px 0 6px; }
  .steps i { flex: 1; height: 6px; border-radius: 99px; background: #eee6dc; }
  .steps i.on { background: var(--gold); }
  .coll { display: flex; flex-direction: column; gap: 6px; }
  .coll .tag { align-self: flex-start; }
  .prog { height: 8px; background: #f1ebe3; border-radius: 99px; overflow: hidden; }
  .prog span { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
  .kv span:first-child { color: var(--muted); }

  .tabs { scrollbar-width: none; display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .tabs button { background: none; border: 0; padding: 10px 14px; font-weight: 700; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button.on { color: var(--ink); border-color: var(--gold); }

  /* drawer + modal */
  .scrim { position: fixed; inset: 0; background: rgba(29,27,26,.45); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--paper); z-index: 70; transform: translateX(100%); transition: transform .25s ease; overflow-y: auto; box-shadow: -20px 0 50px rgba(0,0,0,.15); }
  .drawer.open { transform: none; }
  .dr-h { position: sticky; top: 0; background: var(--paper); padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; z-index: 1; }
  .dr-b { padding: 16px 20px 40px; display: grid; gap: 14px; }
  .x { background: var(--card); border: 1px solid var(--line); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 20px; line-height: 1; flex: none; }
  .modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--paper); border-radius: 20px; z-index: 80; opacity: 0; pointer-events: none; transition: all .2s ease; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
  .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .mo-b { padding: 4px 20px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: grid; gap: 5px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .field.full { grid-column: 1 / -1; }
  .field input, .field select, .field textarea { font-weight: 500; width: 100%; }
  .mo-f { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .lines { display: grid; gap: 8px; }
  .line { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 13.5px; }
  .line .r { margin-left: auto; font-weight: 700; white-space: nowrap; }
  .tl { display: grid; gap: 0; }
  .tl div { display: flex; gap: 10px; font-size: 13.5px; padding: 6px 0; }
  .tl i { width: 10px; height: 10px; border-radius: 50%; background: #d8cfc4; margin-top: 5px; flex: none; }
  .tl i.on { background: var(--gold); }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: var(--cream); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 120; opacity: 0; transition: all .25s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .stars { color: var(--gold); letter-spacing: 1px; }
  .bnav { display: none; }
  .hide-m { }

  @media (max-width: 1100px) {
    .g-2, .g-3 { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; z-index: 90; transform: translateX(-100%); transition: transform .25s ease; }
    aside.open { transform: none; box-shadow: 20px 0 50px rgba(0,0,0,.25); }
    .burger { display: grid; place-items: center; }
    .mlogo { display: block; }
    .crumb { display: none; }
    .gsearch { width: auto; flex: 1; }
    .topbar-in { padding: 10px 16px; gap: 10px; }
    .view { padding: 18px 16px 96px; }
    .sample-chip { display: none; }
    .bnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--ink); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
    .bnav button { background: none; border: 0; color: #cfc6bb; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 700; padding: 6px 2px; border-radius: 10px; cursor: pointer; }
    .bnav button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .bnav button.on { color: var(--gold); }
    .g-2e { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    h1 { font-size: 21px; }
    .g-kpi { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi { padding: 13px; }
    .kpi .val { font-size: 20px; }
    .kpi .lbl { font-size: 11px; letter-spacing: .4px; }
    .filters input[type=search] { max-width: none; min-width: 0; flex-basis: 100%; }
    .filters select { flex: 1 1 calc(50% - 8px); min-width: 0; }
    .tw.cards { border: 0; background: none; overflow: visible; }
    .tw.cards table.t, .tw.cards tbody, .tw.cards tr, .tw.cards td { display: block; width: 100%; }
    .tw.cards thead { display: none; }
    .tw.cards tr { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; padding: 8px 12px; }
    .tw.cards td { border: 0; padding: 5px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
    .tw.cards td::before { content: attr(data-l); color: var(--muted); font-size: 12px; font-weight: 700; text-align: left; flex: none; }
    .tw.cards td.first { font-size: 15px; text-align: left; justify-content: flex-start; padding-bottom: 7px; border-bottom: 1px solid #f1ebe3; margin-bottom: 3px; }
    .tw.cards td.first::before { display: none; }
    .tw.cards td.num { text-align: right; }
    .tw.cards td.szrow { display: block; }
    .tw.cards td.szrow::before { display: block; margin-bottom: 6px; }
    .mo-b { grid-template-columns: 1fr; }
    .modal { top: auto; bottom: 0; left: 0; right: 0; width: 100%; transform: translateY(30px); border-radius: 20px 20px 0 0; max-height: 92vh; }
    .modal.open { transform: none; }

    return '<div class="card coll"><div class="row" style="justify-content:space-between"><span class="badge ' + bcls + ' tag">' + k.status + '</span><span class="muted" style="font-size:12.5px">' + k.season + "</span></div><h2 style=\"font-size:18px\">" + esc(k.name) + '</h2><span class="muted" style="font-size:13px">' + esc(k.note) + '</span><div class="steps">' + CSTEPS.map(function(s, i){ return '<i class="' + (i < k.step ? "on" : "") + '" title="' + s + '"></i>'; }).join("") + '</div><div class="kv"><span>Στάδιο</span><b>' + CSTEPS[Math.max(0, k.step - 1)] + "</b></div>" +

V.stock = function(){
  var u = UI.stock;
  var h = '<div class="head"><div><h1>Προϊόντα & απόθεμα</h1><p class="lead" style="margin:0">Έτοιμο απόθεμα ανά μέγεθος, και το ύφασμα που απομένει για τα κατά παραγγελία κομμάτια.</p></div><div class="row">' +
    (u.tab === "ready" ? '<button class="btn ghost" data-act="receive">Παραλαβή αποθέματος</button><button class="btn pri" data-act="newProduct">' + IC.plus + "Νέο προϊόν</button>" : '<button class="btn pri" data-act="newFabric">' + IC.plus + "Νέο ύφασμα</button>") + "</div></div>";
  h += '<div class="tabs"><button class="' + (u.tab === "ready" ? "on" : "") + '" data-set="stock.tab" data-v="ready">Προϊόντα ανά μέγεθος</button><button class="' + (u.tab === "fab" ? "on" : "") + '" data-set="stock.tab" data-v="fab">Υφάσματα</button></div>';
  if (u.tab === "fab") return h + fabrics();
  var cats = {}; PRODUCTS.forEach(function(p){ cats[p.cat] = 1; });
  h += '<div class="filters">' + srch("stock.q", u.q, "Όνομα, print, κωδικός…") + sel("stock.cat", u.cat, [["all","Όλες οι κατηγορίες"]].concat(Object.keys(cats).map(function(c){ return [c, c]; })), "Κατηγορία") + '<label class="tog"><input type="checkbox" data-f="stock.low"' + (u.low ? " checked" : "") + "> Έτοιμα με εξαντλημένα μεγέθη</label></div>";
  var sold30 = {}; DB.orders.forEach(function(o){ if ((TODAY - o.date) / 864e5 <= 30 && o.status !== "cancel") o.items.forEach(function(x){ sold30[x.pid] = (sold30[x.pid] || 0) + x.qty; }); });
  var rows = PRODUCTS.filter(function(p){
    if (u.cat !== "all" && p.cat !== u.cat) return false;

    if (u.low && (!p.ready || !p.sizes.some(function(z){ return !p.stock[z]; }))) return false;
    return true;
  });
  var units = sumBy(rows, function(p){ return sumBy(p.sizes, function(z){ return p.stock[z] || 0; }); });
  var val = sumBy(rows, function(p){ return sumBy(p.sizes, function(z){ return (p.stock[z] || 0) * (p.sale || p.price); }); });
  h += '<div class="sum"><b>' + rows.length + "</b> κωδικοί · <b>" + nf0.format(units) + "</b> τεμάχια έτοιμα · αξία λιανικής <b>" + eur(val) + '</b> · <span class="sz zero" style="height:20px;min-width:22px;font-size:11px">0</span> εξαντλημένο <span class="sz low" style="height:20px;min-width:22px;font-size:11px">2</span> χαμηλό · <span class="sz mto" style="height:20px;min-width:22px;font-size:11px">1</span> ραμμένα από πριν (κατά παραγγελία)</div>';
  if (!rows.length) return h + '<div class="card empty">Δεν βρέθηκαν προϊόντα.</div>';
  h += '<div class="tw cards"><table class="t"><thead><tr><th>Προϊόν</th><th class="num">Τιμή</th><th>Τύπος</th>' + ALLSZ.map(function(z){ return '<th class="sz-h">' + z + "</th>"; }).join("") + '<th class="num">Σύνολο</th><th class="num">Πωλ. 30ημ.</th></tr></thead><tbody>';
  rows.forEach(function(p){
    var tot = sumBy(p.sizes, function(z){ return p.stock[z] || 0; });

      '<td class="num" data-l="Τιμή">' + (p.sale ? '<span class="badge b-sale">' + eur(p.sale) + '</span> <s class="muted">' + eur(p.price) + "</s>" : eur(p.price)) + '</td><td data-l="Τύπος">' + (p.ready ? '<span class="badge b-done">Έτοιμο</span>' : '<span class="badge b-new">Κατά παραγγελία</span>') + "</td>" +

function szCell(p, z){ var v = p.stock[z] || 0; return '<span class="sz ' + (!p.ready ? (v ? "mto" : "mto0") : v === 0 ? "zero" : v <= 2 ? "low" : "") + '">' + v + "</span>"; }
function cellsMobile(p){

  if (p.sizes === SZ_K || p.sizes === SZ_1) return '<td class="szrow" colspan="' + ALLSZ.length + '" data-l="' + (p.sizes === SZ_K ? "Ηλικίες" : "Μέγεθος") + '"><span class="szflex">' + p.sizes.map(function(z){ return '<span class="szi">' + szCell(p, z) + "<small>" + z + "</small></span>"; }).join("") + "</span></td>";
  return ALLSZ.map(function(z){ return '<td class="szc hide-m">' + (p.sizes.indexOf(z) >= 0 ? szCell(p, z) : '<span class="sz na">·</span>') + "</td>"; }).join("") +
    '<td class="szrow show-m" data-l="Μεγέθη"><span class="szflex">' + p.sizes.map(function(z){ return '<span class="szi">' + szCell(p, z) + "<small>" + z + "</small></span>"; }).join("") + "</span></td>";
}
function fabrics(){
  var rows = DB.fabrics.slice().sort(function(a, b){ return a.meters / Math.max(a.reorder, 1) - b.meters / Math.max(b.reorder, 1); });
  var low = rows.filter(function(f){ return f.meters < f.reorder; });
  var h = '<div class="note">✦ <span>Το «φτάνει για» υπολογίζεται από τα μέτρα που χρειάζεται κάθε μοντέλο (π.χ. Renata ≈ 2,6 μ.) και τις πωλήσεις των τελευταίων 30 ημερών.</span></div>';
  h += '<div class="sum"><b>' + rows.length + "</b> υφάσματα · <b>" + nf0.format(sumBy(rows, function(f){ return f.meters; })) + "</b> μέτρα · αξία <b>" + eur(sumBy(rows, function(f){ return f.meters * f.cost; })) + "</b> · <b class=\"down\">" + low.length + " κάτω από το όριο</b></div>";
  return h + table([
    { l: "Ύφασμα", f: function(f){ return '<span class="pname">' + swatch(f.print) + "<div><b>" + esc(f.print) + "</b><small>" + esc(f.type) + " · " + f.width + " εκ.</small></div></span>"; } },
    { l: "Απόθεμα", cls: "num", f: function(f){ return '<b class="' + (f.meters < f.reorder ? "down" : "") + '">' + nf0.format(f.meters) + " μ.</b>"; } },
    { l: "Όριο", cls: "num", f: function(f){ return nf0.format(f.reorder) + " μ."; } },
    { l: "Χρήση 30ημ.", cls: "num", f: function(f){ return f.use30 ? nf0.format(f.use30) + " μ." : "—"; } },
    { l: "Φτάνει για", cls: "num", f: function(f){ if (!f.use30) return "—"; var d = Math.round(f.meters / f.use30 * 30); return '<span class="badge ' + (d < 14 ? "b-bad" : d < 30 ? "b-prod" : "b-done") + '">~' + d + " ημέρες</span>"; } },
    { l: "Προμηθευτής", f: function(f){ var s = byId(DB.suppliers, f.sup); return esc(s.name.replace(" (δείγμα)", "")) + ' <small class="muted">· ' + s.lead + " ημ.</small>"; } },
    { l: "", f: function(f){ return f.meters < f.reorder ? '<button class="btn gold sm" data-act="reorder" data-id="' + f.id + '">Παραγγελία</button>' : ""; } }
  ], rows);
}

  // size insight by model

      { k: "amount", l: "Ποσό (€)", t: "number", v: "", min: 0, step: "0.01", req: true }, { k: "desc", l: "Περιγραφή", req: true, full: true },

function iso(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

function gsearch(q){
  var box = $("#gres"); if (q.trim().length < 2) { box.classList.remove("open"); return; }
  var os = DB.orders.filter(function(o){ return has(o.id + " " + DB.cust[o.cid].name, q); }).slice(0, 4);
  var cs = DB.customers.filter(function(c){ return c.orders.length && has(c.name + " " + c.city, q); }).slice(0, 4);
  var ps = PRODUCTS.filter(function(p){ return has(p.name + " " + p.print + " " + p.sku, q); }).slice(0, 4);
  var h = "";
  if (os.length) h += '<div class="gh">Παραγγελίες</div>' + os.map(function(o){ return '<button data-act="order" data-id="' + o.id + '"><b>' + o.id + "</b> <small>" + esc(DB.cust[o.cid].name) + " · " + eur(o.total) + "</small></button>"; }).join("");
  if (cs.length) h += '<div class="gh">Πελάτες</div>' + cs.map(function(c){ return '<button data-act="cust" data-id="' + c.id + '"><b>' + esc(c.name) + "</b> <small>" + esc(c.city) + "</small></button>"; }).join("");
  if (ps.length) h += '<div class="gh">Προϊόντα</div>' + ps.map(function(p){ return '<button data-act="product" data-id="' + p.id + '"><span class="pname">' + swatch(p.print) + "<span><b>" + esc(p.name) + "</b> <small>" + esc(p.print) + "</small></span></span></button>"; }).join("");
  box.innerHTML = h || '<div class="gh" style="padding:12px 14px">Δεν βρέθηκε κάτι</div>'; box.classList.add("open");
}
function exportCsv(){
  var rows = [["Ημερομηνία","Κατηγορία","Περιγραφή","Ποσό"]].concat(DB.expenses.map(function(e){ return [dfmt(e.date), e.cat, e.desc, String(e.amount).replace(".", ",")]; }));
  var csv = "﻿" + rows.map(function(r){ return r.map(function(c){ return '"' + String(c).replace(/"/g, '""') + '"'; }).join(";"); }).join("\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "ritc-exoda-deigma.csv"; a.click(); toast("Λήψη ritc-exoda-deigma.csv");
}

var tip = $("#tip");
document.addEventListener("mousemove", function(e){
  var t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.getAttribute("data-tip"); tip.style.display = "block";
  var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
document.addEventListener("touchstart", function(e){ var t = e.target.closest && e.target.closest("[data-tip]"); if (!t) { tip.style.display = "none"; return; } var r = t.getBoundingClientRect(); tip.innerHTML = t.getAttribute("data-tip"); tip.style.display = "block"; tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + "px"; tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px"; }, { passive: true });
