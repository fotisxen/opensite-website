<!doctype html>
<html lang="el" class="notes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Τιμοκατάλογος · Guzel Beauty Studio & Wellness</title>
<meta name="description" content="Όλες οι τιμές του Guzel: pilates, laser, θεραπείες προσώπου και σώματος, νύχια, πεντικιούρ, φρύδια και βλεφαρίδες, στο κέντρο της Θεσσαλονίκης και στη Θέρμη.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,300;0,400;1,300;1,400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<script>(function(){var h=document.documentElement;try{var q=new URLSearchParams(location.search);if(q.has("clean")||localStorage.getItem("gz-notes")==="off")h.classList.remove("notes");if(q.has("clean"))h.classList.add("clean");}catch(e){}})();</script>
<link rel="stylesheet" href="guzel.css">
<style>
.tools{position:sticky;top:84px;z-index:20;background:rgba(251,249,246,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 0}
.tools .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tools input{flex:1;min-width:220px;padding:14px 18px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff;font-size:16px;outline:none}
.tools input:focus{box-shadow:inset 0 0 0 1.5px var(--sky3)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;width:100%}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;padding:9px 14px;border-radius:999px;font-size:13px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);background:#fff}
.cats a:hover{background:var(--ink);color:var(--paper)}
.pgroup{padding-top:70px;scroll-margin-top:200px}
.pgroup-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.pgroup-head a{font:400 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--sky3)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.count{font-size:13px;color:var(--muted)}
</style>
</head>
<body data-page="prices">

<section class="phero" style="padding-bottom:60px">
  <div class="silk" data-silk></div>
  <div class="wrap">
    <p class="crumbs"><a href="demo.html">Guzel</a> · Τιμοκατάλογος</p>
    <h1 class="display">Τιμο<em>κατάλογος</em></h1>
    <p class="lead" style="margin-top:22px">Όλες οι υπηρεσίες μας, με τιμές και διάρκεια. Διαλέξτε κατάστημα για να δείτε τι προσφέρει το καθένα, και κλείστε με ένα κλικ.</p>
  </div>
</section>

<div class="tools"><div class="wrap">
  <div class="seg" id="locSeg"><button class="on" data-l="all">Όλα</button><button data-l="c">Κέντρο</button><button data-l="t">Θέρμη</button></div>
  <input id="q" type="search" placeholder="Αναζήτηση: lash, ημιμόνιμο, μασχάλες, hydrafacial…" aria-label="Αναζήτηση υπηρεσίας">
  <span class="count" id="count"></span>
  <nav class="cats" id="cats"></nav>
</div></div>

<section class="sec" style="padding-top:10px"><div class="wrap" id="groups"></div></section>

<script src="data.js"></script>
<script src="guzel.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const S = GZ_SVC, EUR = GZ_EUR, CAT = GZ_CATALOG;
let loc = "all";
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function render() {
  const q = norm($("#q").value.trim());
  let n = 0;
  const out = CAT.map(g => {
    const items = g.items.map(i => S[i[0]]).filter(s => (loc === "all" || GZ_AT(s, loc)) && (!q || norm(s.name + " " + (s.note || "") + " " + g.name).includes(q)));
    n += items.length;
    if (!items.length) return "";
    return `<div class="pgroup" id="g-${g.id}"><div class="pgroup-head"><h2 class="h3">${g.name}</h2><a href="${g.page}">Περισσότερα →</a></div><div class="menu-list">${items.map(s => {
      const p = loc === "c" ? GZ_PRICE(s, "c") : s.price;
      return `<div class="mrow"><div><b>${s.name}${s.where !== "b" && loc === "all" ? ` <i class="where">${GZ_WHERE(s)}</i>` : ""}</b><span>${GZ_MIN(s.min)}${s.note ? " · " + s.note : ""}${s.pc && loc === "all" ? ` · στο κέντρο ${EUR(s.pc)}` : ""}</span></div><span class="price">${s.was ? `<s>${EUR(s.was)}</s> ` : ""}${EUR(p)}</span><button class="bk" data-book="${s.id}" ${loc !== "all" ? `data-loc="${loc}"` : ""} aria-label="Κράτηση ${s.name}">→</button></div>`;
    }).join("")}</div></div>`;
  }).join("");
  $("#groups").innerHTML = out || `<p class="empty">Δεν βρέθηκε υπηρεσία. Δοκιμάστε άλλη λέξη ή άλλο κατάστημα.</p>`;
  $("#count").textContent = `${n} υπηρεσίες`;
  $("#cats").innerHTML = CAT.filter(g => document.getElementById("g-" + g.id)).map(g => `<a href="#g-${g.id}">${g.name}</a>`).join("");
}
$("#q").addEventListener("input", render);
$("#locSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; loc = b.dataset.l; $$("#locSeg button").forEach(x => x.classList.toggle("on", x === b)); render(); });
const want = new URLSearchParams(location.search).get("loc"); if (want === "c" || want === "t") { loc = want; $$("#locSeg button").forEach(x => x.classList.toggle("on", x.dataset.l === want)); }
render();
})();
</script>
</body>
</html>
