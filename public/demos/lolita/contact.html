<!doctype html>
<html lang="el" class="notes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Επικοινωνία · Lolita Boutique, Επτανήσου 44 &amp; Φωκίωνος Νέγρη</title>
<meta name="description" content="Lolita boutique Athens: ωράριο, χάρτης, τηλέφωνα 210 8840409 και 693 6901447.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var h=document.documentElement;try{var q=new URLSearchParams(location.search);if(q.has("clean")||localStorage.getItem("lo-notes")==="off")h.classList.remove("notes");if(q.has("clean"))h.classList.add("clean");}catch(e){}})();</script>
<link rel="stylesheet" href="lolita.css">
<style>
.hours{list-style:none;display:grid;gap:9px;font-size:15px}
.hours li{display:flex;justify-content:space-between;padding-bottom:9px;border-bottom:1px dashed var(--line)}
.hours li.now{color:var(--gold)}
.statusbadge{display:inline-flex;align-items:center;gap:9px;padding:8px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;margin-bottom:18px}
.statusbadge i{width:8px;height:8px;border-radius:50%;background:#2f8f58}
.statusbadge.shut i{background:var(--red)}
.mapbox{border-radius:var(--r);overflow:hidden;height:400px;box-shadow:0 1px 0 var(--line)}
.mapbox iframe{width:100%;height:100%;border:0}
.tels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media(max-width:560px){.tels{grid-template-columns:1fr}}
.tels a{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 var(--line);display:block}
.tels b{display:block;font:500 22px/1.2 var(--serif)}
.tels span{font-size:13px;color:var(--ink2)}
</style>
</head>
<body data-page="contact">

<header class="phead"><div class="wrap">
  <span class="eyebrow">Επικοινωνία</span>
  <h1>Επτανήσου 44 &amp; <em>Φωκίωνος Νέγρη</em></h1>
  <p class="lead">Αθήνα, Κυψέλη. Πάνω στον πεζόδρομο.</p>
</div></header>

<section style="padding-top:26px"><div class="wrap">
  <div class="split" style="align-items:start">
    <div>
      <div class="statusbadge" id="st"><i></i><span>—</span></div>
      <h2 style="font-size:26px;margin-bottom:14px">Ωράριο</h2>
      <ul class="hours ph" id="hours" data-note="Βάλε το πραγματικό σου ωράριο"></ul>
      <div class="tels">
        <a href="tel:+302108840409"><b>210 8840409</b><span>σταθερό καταστήματος</span></a>
        <a href="tel:+306936901447"><b>693 6901447</b><span>κινητό · και για μήνυμα</span></a>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
        <a class="btn btn-ink" href="https://maps.google.com/?q=Eptanisou+44+Athina" target="_blank" rel="noopener">Οδηγίες</a>
        <a class="btn btn-line" href="https://www.instagram.com/lolita_boutique_athens/" target="_blank" rel="noopener">@lolita_boutique_athens</a>
      </div>
    </div>
    <div>
      <div class="mapbox" style="margin-bottom:22px">
        <iframe title="Χάρτης" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=Eptanisou%2044%2C%20Athina&z=17&output=embed"></iframe>
      </div>
      <div class="card">
        <h2 style="font-size:24px;margin-bottom:14px">Στείλε μας μήνυμα</h2>
        <label class="field"><span>Όνομα</span><input id="n" autocomplete="name"></label>
        <label class="field"><span>Κινητό</span><input id="e" inputmode="tel" autocomplete="tel"></label>
        <label class="field"><span>Τι ψάχνεις</span><textarea id="m" rows="3" placeholder="π.χ. μπότες σε 38, μαύρες"></textarea></label>
        <button class="btn btn-ink" id="go" style="width:100%">Αποστολή</button>
        <div class="okbox" id="ok"></div>
      </div>
    </div>
  </div>
</div></section>

<script src="lolita.js"></script>
<script>
const HOURS=[["Δευτέρα",[10,15]],["Τρίτη",[10,20]],["Τετάρτη",[10,15]],["Πέμπτη",[10,20]],["Παρασκευή",[10,20]],["Σάββατο",[10,16]],["Κυριακή",null]];
const dow=()=>(new Date().getDay()+6)%7,nowH=()=>{const n=new Date();return n.getHours()+n.getMinutes()/60;};
document.getElementById("hours").innerHTML=HOURS.map(([d,h],i)=>`<li class="${i===dow()?'now':''}"><span>${d}</span><b>${h?h[0]+":00 – "+h[1]+":00":"κλειστά"}</b></li>`).join("");
(function(){const b=document.getElementById("st"),t=b.querySelector("span"),h=HOURS[dow()][1];
 if(h&&nowH()>=h[0]&&nowH()<h[1]) t.textContent="Ανοιχτά τώρα · μέχρι "+h[1]+":00";
 else{b.classList.add("shut");let i=dow(),d=0;while(d<7){i=(i+1)%7;d++;if(HOURS[i][1])break;}
  t.textContent="Κλειστά · ανοίγουμε "+HOURS[i][0]+" "+HOURS[i][1][0]+":00";}})();
document.getElementById("go").onclick=()=>{const o=document.getElementById("ok");
 if(!document.getElementById("n").value.trim()||!document.getElementById("e").value.trim()){o.textContent="Συμπλήρωσε όνομα και κινητό.";o.classList.add("on");return;}
 o.innerHTML="✓ Το μήνυμα στάλθηκε. Θα σου απαντήσουμε σύντομα.<br><span class='small'>(demo — δεν στέλνεται τίποτα)</span>";o.classList.add("on");};
</script>
</body>
</html>
