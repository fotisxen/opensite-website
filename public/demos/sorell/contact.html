<!doctype html>
<html lang="el" class="notes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Επικοινωνία · Sorell Boutique, Λεωφ. Στρατού 35, Θεσσαλονίκη</title>
<meta name="description" content="Sorell Boutique, Λεωφ. Στρατού 35, Θεσσαλονίκη. Ωράριο, χάρτης και φόρμα επικοινωνίας.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var h=document.documentElement;try{var q=new URLSearchParams(location.search);if(q.has("clean")||localStorage.getItem("sr-notes")==="off")h.classList.remove("notes");if(q.has("clean"))h.classList.add("clean");}catch(e){}})();</script>
<link rel="stylesheet" href="sorell.css">
<style>
.hours{list-style:none;display:grid;gap:9px;font-size:15px}
.hours li{display:flex;justify-content:space-between;padding-bottom:9px;border-bottom:1px dashed var(--line)}
.hours li.now{color:var(--gold)}
.statusbadge{display:inline-flex;align-items:center;gap:9px;padding:8px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;margin-bottom:18px}
.statusbadge i{width:8px;height:8px;border-radius:50%;background:#2f8f58}
.statusbadge.shut i{background:var(--red)}
.mapbox{border-radius:var(--r);overflow:hidden;height:380px;box-shadow:0 1px 0 var(--line)}
.mapbox iframe{width:100%;height:100%;border:0}
.chans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:28px}
.chans a{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 1px 0 var(--line);display:block;transition:transform .2s}
.chans a:hover{transform:translateY(-3px)}
.chans b{display:block;font:500 20px/1.2 var(--serif);margin-bottom:5px}
.chans span{font-size:13.5px;color:var(--ink2)}
</style>
</head>
<body data-page="contact">

<header class="phead"><div class="wrap">
  <span class="eyebrow">Επικοινωνία</span>
  <h1>Λεωφ. <em>Στρατού 35</em></h1>
  <p class="lead">Θεσσαλονίκη. Πέρνα από το μαγαζί, πάρε τηλέφωνο ή στείλε μας μήνυμα από εδώ.</p>
</div></header>

<section style="padding-top:26px"><div class="wrap">
  <div class="split" style="align-items:start">
    <div>
      <div class="statusbadge" id="st"><i></i><span>—</span></div>
      <h2 style="font-size:26px;margin-bottom:14px">Ωράριο</h2>
      <ul class="hours ph" id="hours" data-note="Βάλε το πραγματικό σου ωράριο"></ul>
      <div class="chans">
        <a href="https://www.instagram.com/sorell_boutique/" target="_blank" rel="noopener"><b>Instagram</b><span>@sorell_boutique</span></a>
        <a href="https://www.tiktok.com/@sorell_boutique_" target="_blank" rel="noopener"><b>TikTok</b><span>@sorell_boutique_</span></a>
        <a class="ph" data-note="Βάλε το τηλέφωνο του καταστήματος" href="#"><b>Τηλέφωνο</b><span>Στο κατάστημα</span></a>
        <a class="ph" data-note="Βάλε το email σου" href="#"><b>Email</b><span>info@sorellboutique.gr</span></a>
      </div>
    </div>
    <div>
      <div class="mapbox" style="margin-bottom:22px">
        <iframe title="Χάρτης" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=Leoforos%20Stratou%2035%2C%20Thessaloniki&z=16&output=embed"></iframe>
      </div>
      <div class="card">
        <h2 style="font-size:24px;margin-bottom:14px">Στείλε μήνυμα</h2>
        <label class="field"><span>Όνομα</span><input id="n" autocomplete="name"></label>
        <label class="field"><span>Email ή κινητό</span><input id="e" autocomplete="email"></label>
        <label class="field"><span>Θέμα</span>
          <select id="s"><option>Ερώτηση για προϊόν</option><option>Νούμερο / εφαρμογή</option><option>Αποστολή εκτός Ελλάδας</option><option>Επιστροφή ή αλλαγή</option><option>Άλλο</option></select></label>
        <label class="field"><span>Μήνυμα</span><textarea id="m" rows="4"></textarea></label>
        <button class="btn btn-ink" id="go" style="width:100%">Αποστολή</button>
        <div class="okbox" id="ok"></div>
        <p class="small" style="margin-top:12px" class="ph">Απαντάμε συνήθως μέσα στην ίδια μέρα.</p>
      </div>
    </div>
  </div>
</div></section>

<script src="sorell.js"></script>
<script>
const HOURS=[["Δευτέρα",[10,15]],["Τρίτη",[10,20.5]],["Τετάρτη",[10,15]],["Πέμπτη",[10,20.5]],["Παρασκευή",[10,20.5]],["Σάββατο",[10,16]],["Κυριακή",null]];
const fm=t=>Math.floor(t)+":"+(t%1?"30":"00");
const dow=()=>(new Date().getDay()+6)%7,nowH=()=>{const n=new Date();return n.getHours()+n.getMinutes()/60;};
document.getElementById("hours").innerHTML=HOURS.map(([d,h],i)=>`<li class="${i===dow()?'now':''}"><span>${d}</span><b>${h?fm(h[0])+" – "+fm(h[1]):"κλειστά"}</b></li>`).join("");
(function(){const b=document.getElementById("st"),t=b.querySelector("span"),h=HOURS[dow()][1];
 if(h&&nowH()>=h[0]&&nowH()<h[1]) t.textContent="Ανοιχτά τώρα · μέχρι "+fm(h[1]);
 else{b.classList.add("shut");let i=dow(),d=0;while(d<7){i=(i+1)%7;d++;if(HOURS[i][1])break;}
  t.textContent="Κλειστά · ανοίγουμε "+HOURS[i][0]+" "+fm(HOURS[i][1][0]);}})();
document.getElementById("go").onclick=()=>{const o=document.getElementById("ok");
 if(!document.getElementById("n").value.trim()||!document.getElementById("e").value.trim()){o.textContent="Συμπλήρωσε όνομα και τρόπο επικοινωνίας.";o.classList.add("on");return;}
 o.innerHTML="✓ Το μήνυμα στάλθηκε. Θα σου απαντήσουμε σύντομα.<br><span class='small'>(demo — δεν στέλνεται τίποτα)</span>";o.classList.add("on");};
</script>
</body>
</html>
