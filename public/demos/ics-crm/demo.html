<!doctype html>
<html lang="en" class="notes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1512">
<title>ICS Workspace · clients, cases & tasks</title>
<meta name="description" content="CRM demo for Integrated Consulting Services: client cards, cases with documents and properties, tasks between six offices, website inbox, calendar, invoices and permissions. EN / ΕΛ / FR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  OpenSite CRM demo for Integrated Consulting Services (icsgr.com).
  Shares its data with the website demo (/demos/ics/) through store.js: a quote, booking, upload or payment
  on the website appears here at once (open both side by side). Clients, cases and tasks are made up;
  offices, phones and team names come from icsgr.com (Nov 2026). Everything runs in the browser; "Reset demo" restores it.
-->
<style>
:root{--bg:#f4f3ee;--card:#fff;--ink:#0f1512;--muted:#67716b;--lime:#9eaf00;--lime2:#eef3c4;--deep:#0f1512;--line:rgba(15,21,18,.1);
  --red:#c2410c;--amber:#b7791f;--green:#2f7d4f;--blue:#2459a8;--f:"Inter Tight",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh;height:100dvh}

/* sidebar */
.side{background:var(--deep);color:#d9dfda;display:flex;flex-direction:column;padding:16px 12px;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font:700 18px/1 var(--f);color:#fff}
.brand i{width:30px;height:24px;border-radius:6px 6px 6px 0;background:var(--lime);display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;letter-spacing:1px}
.brand small{display:block;font:500 11px/1.2 var(--f);color:#8e9a92;margin-top:3px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:500;color:#c4ccc6;text-align:left;width:100%}
.nv:hover{background:#1c2520}
.nv.on{background:#232e28;color:#fff}
.nv .ic{width:18px;text-align:center;opacity:.8}
.nv span{flex:1}
.nv em{font-style:normal;font-size:11.5px;font-weight:700;background:var(--lime);color:#10140a;border-radius:999px;padding:2px 7px}
.nv em:empty{display:none}
.sh{font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:#6f7b73;padding:16px 10px 6px}
.offs div{display:flex;justify-content:space-between;padding:5px 10px;font-size:12.5px;color:#9aa69f}
.offs b{color:#dfe5e0;font-weight:500}
.offs i{font-style:normal}
.offs .op::before{content:"● ";color:#7ccf8f}
.offs .cl::before{content:"● ";color:#59645d}
.sfoot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:#6f7b73;display:grid;gap:4px}
.sfoot a,.sfoot button{color:var(--lime);text-align:left}

/* top */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(244,243,238,.92);backdrop-filter:blur(10px)}
.burger{display:none;font-size:20px;padding:6px}
.search{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:9px 12px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);cursor:text;min-width:0}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search kbd{margin-left:auto;font:600 11px/1 var(--f);padding:3px 6px;border-radius:5px;background:#eeede7}
.lang{display:flex;background:#e6e5de;border-radius:9px;padding:3px}
.lang button{font:600 12px/1 var(--f);padding:7px 8px;border-radius:7px;color:var(--muted)}
.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bell{position:relative;width:38px;height:38px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:16px}
.bell em{position:absolute;top:-4px;right:-4px;font:700 10.5px/1 var(--f);background:var(--red);color:#fff;border-radius:999px;padding:3px 6px;font-style:normal}
.bell em:empty{display:none}
.me{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.me select{border:0;background:none;font-weight:600;max-width:200px;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--f);color:#fff;background:#38463e;flex:none}
.new{padding:10px 14px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;white-space:nowrap}
.view{flex:1;overflow:auto;padding:22px 20px 70px}

/* common */
.h1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.h1 h1{font:600 26px/1.1 var(--f);letter-spacing:-.02em}
.h1 p{color:var(--muted);margin-top:4px}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 10px 30px -24px rgba(15,21,18,.35)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:9px;font-weight:600;background:var(--ink);color:#fff;white-space:nowrap}
.btn.l{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.g{background:var(--lime);color:#10140a}
.btn.s{padding:6px 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f);padding:5px 8px;border-radius:999px;background:#eeede7;color:#47524b;white-space:nowrap}
.pill.lime{background:var(--lime2);color:#4f5a00}.pill.red{background:#fde7dc;color:var(--red)}.pill.amber{background:#fbefd5;color:var(--amber)}.pill.green{background:#dff1e5;color:var(--green)}.pill.blue{background:#e2ebf8;color:var(--blue)}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.box{padding:16px}
.box h3{font:600 15px/1.2 var(--f);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kp .card{padding:14px 16px}
.kp b{display:block;font:600 28px/1.1 var(--f);letter-spacing:-.02em}
.kp small{color:var(--muted)}
.dg{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
.stack{display:grid;gap:14px;align-content:start}
@media(max-width:1100px){.dg,.cols{grid-template-columns:1fr}}
@media(max-width:700px){.kp{grid-template-columns:1fr 1fr}}

/* rows */
.tr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.tr:first-of-type{border-top:0}
.tr:hover{background:#fafaf6}
.ck{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #b9bfb9;display:grid;place-items:center;color:#fff;font-size:12px;margin-top:1px}
.ck.on{background:var(--green);box-shadow:none}
.tr b{font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center;font-size:12.5px;color:var(--muted)}
.tr.done b{text-decoration:line-through;color:var(--muted)}
.fresh{animation:fr 2.2s}
@keyframes fr{0%{background:var(--lime2)}}
.due{font-size:12.5px;font-weight:600;white-space:nowrap}
.due.late{color:var(--red)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:8px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tabs button em{font-style:normal;margin-left:4px;font-size:12px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font:600 11.5px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#fafaf6}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block;color:var(--muted);font-size:12.5px}
.scroll{overflow:auto}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.flt input,.flt select{padding:9px 12px;border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff}

/* case */
.back{display:inline-flex;gap:6px;color:var(--muted);font-weight:600;margin-bottom:10px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.dh h1{font:600 24px/1.15 var(--f);letter-spacing:-.02em}
.dh .sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.steps{display:flex;gap:4px;margin:4px 0 2px}
.steps button{flex:1;text-align:left;padding:9px 8px 7px;border-top:4px solid #dddcd4;font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.steps button.done{border-color:var(--lime);color:var(--ink)}
.steps button.cur{border-color:var(--ink);color:var(--ink)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:500;word-break:break-word}
.kv input{width:100%;border:0;padding:4px 6px;margin:-4px -6px;border-radius:6px;background:transparent;font-weight:500}
.kv input:focus{background:#f4f3ee;outline:none}
.chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);background:#fff;cursor:pointer;text-align:left;width:100%}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip small{display:block;color:var(--muted);font-size:12.5px}
.chip .x{margin-left:auto}
.doc{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0}
.doc .ic{width:30px;height:36px;border-radius:5px;background:#eeede7;display:grid;place-items:center;font:700 9px/1 var(--f);color:#6b736d}
.doc .ic.pdf{background:#fde7dc;color:var(--red)}
.doc select{border:0;background:#f4f3ee;border-radius:7px;padding:5px 6px;font-size:12.5px;font-weight:600}
.drop{margin-top:10px;padding:14px;border-radius:12px;border:1.5px dashed #c6cbc4;text-align:center;color:var(--muted);cursor:pointer;transition:all .2s}
.drop:hover,.drop.ov{border-color:var(--lime);background:var(--lime2);color:var(--ink)}
.prop{padding:12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);margin-top:8px;font-size:13.5px}
.act{display:grid;gap:10px;font-size:13.5px}
.act>div{display:grid;grid-template-columns:28px 1fr;gap:10px}
.act small{color:var(--muted)}
.note{width:100%;min-height:64px;padding:10px 12px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1px var(--line);resize:vertical}
.pt{background:#0f1512;color:#e6ebe7;border-radius:14px;padding:16px}
.pt h3{color:#fff}
.pt .muted{color:#9aa69f}
.bub{background:#f4f3ee;border-radius:4px 12px 12px 12px;padding:9px 11px}
.pt .bub{background:#1e2823}
.pt .mine .bub{background:#3b4a13}
.cm{display:grid;grid-template-columns:28px 1fr;gap:10px;margin-top:10px;font-size:13.5px}
.cm small{color:var(--muted)}
.sw{position:relative;width:38px;height:22px;border-radius:999px;background:#c9ccc6;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--lime)}.sw.on::after{left:19px}

/* calendar & reports */
.day{margin-bottom:14px}
.day h4{font:600 12px/1 var(--f);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px}
.ap{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.ap:first-of-type{border-top:0}
.ap .tm{font:600 17px/1.1 var(--f)}
.ap .tm small{display:block;font:500 11.5px/1.3 var(--f);color:var(--muted)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--lime)}
.bar b{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* settings */
.perm td select{border:0;background:#f4f3ee;border-radius:7px;padding:6px 8px;font-weight:600}
.sec{display:grid;gap:10px}
.sec div{display:flex;gap:12px;align-items:flex-start}
.sec b{display:block}
.okc{width:26px;height:26px;border-radius:8px;background:#dff1e5;color:var(--green);display:grid;place-items:center;font-weight:700;flex:none}
.map{display:grid;grid-template-columns:1fr 24px 1fr;gap:8px;align-items:center;font-size:13.5px}
.map select{padding:7px;border-radius:8px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(15,21,18,.35);z-index:80;display:none}
.ov.on{display:block}
.modal{position:fixed;left:50%;top:7vh;transform:translateX(-50%);width:min(580px,calc(100% - 24px));max-height:86vh;overflow:auto;z-index:81;display:none;padding:20px}
.modal.on{display:block}
.modal h2{font:600 19px/1.2 var(--f);margin-bottom:14px;display:flex;justify-content:space-between;gap:10px}
.fm{display:grid;gap:10px}
.fm label{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.fm input,.fm select,.fm textarea{padding:10px 12px;border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff;color:var(--ink);font-weight:400;font-size:14.5px;min-width:0}
.fm .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fm .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 11px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:13px;background:#fff}
.seg button.on{background:var(--ink);color:#fff;box-shadow:none}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);background:#fff;z-index:81;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.drawer.on{transform:none}
.dhd{padding:18px 20px;border-bottom:1px solid var(--line)}
.dbd{padding:16px 20px;overflow:auto;flex:1}
.dft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.dft input{flex:1;min-width:0;padding:10px 12px;border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--line)}
.pop{position:fixed;top:58px;right:18px;width:min(380px,calc(100% - 24px));z-index:81;display:none;padding:8px;max-height:70vh;overflow:auto}
.pop.on{display:block}
.pop button{display:grid;grid-template-columns:10px 1fr;gap:10px;width:100%;text-align:left;padding:10px;border-radius:9px;font-size:13.5px}
.pop button:hover{background:#f4f3ee}
.pop button i{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:6px}
.pop button.rd i{background:transparent}
.pop small{display:block;color:var(--muted);font-size:12px}
.palette{top:12vh;padding:0;overflow:hidden}
.palette input{width:100%;padding:16px 18px;border:0;border-bottom:1px solid var(--line);font-size:16px;outline:none}
.pres{max-height:55vh;overflow:auto;padding:6px}
.pres button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;text-align:left}
.pres button:hover,.pres button.sel{background:#f4f3ee}
.pres small{color:var(--muted);margin-left:auto;font-size:12px}
.mail{border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;font-size:14px}
.mail .mh{background:#f4f3ee;padding:12px 14px;font-size:13px;color:var(--muted)}
.mail .mb{padding:16px}
.mail .mb h4{font:600 16px/1.3 var(--f);margin:14px 0 6px}
.mail .mb li{margin:4px 0 4px 18px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,160%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:99;transition:transform .3s;max-width:calc(100% - 32px);font-size:14px;cursor:pointer}
.toast.on{transform:translate(-50%,0)}
.toast.live{background:#3b4a13}
.tip{position:fixed;right:16px;bottom:16px;z-index:70;max-width:310px;background:var(--lime2);color:#2d3300;border-radius:14px;padding:12px 30px 12px 14px;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.25)}
.tip b{display:block;margin-bottom:2px}
.tip button{position:absolute;top:6px;right:10px;font-size:16px;color:#5d6620}
.tip a{text-decoration:underline;font-weight:600}
html:not(.notes) .tip{display:none}

/* login */
.login{position:fixed;inset:0;z-index:95;background:radial-gradient(circle at 20% 10%,#2b3a14,#0f1512 60%);display:grid;place-items:center;padding:16px}
.login .card{width:min(400px,100%);padding:28px}
.login h1{font:600 22px/1.2 var(--f);margin:16px 0 4px}
.login .codes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.login .codes input{width:100%;min-width:0;height:54px;text-align:center;font:600 22px/1 var(--f);padding:0;border-radius:10px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff}
.login .codes input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--lime)}
.login .foot{margin-top:16px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:256px;z-index:85;transform:translateX(-100%);transition:transform .25s}
  .side.on{transform:none}
  .burger{display:block}
  .search kbd,.me select,.search span{display:none}
  .search{flex:0 0 auto}
  .top{padding:8px 10px;gap:6px}
  .view{padding:16px 12px 70px}
  .tbl .hm{display:none}
  .fm .r2{grid-template-columns:1fr}
  .new span{display:none}
}
</style>
<script src="store.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i>ICS</i><div>Workspace<small>Integrated Consulting Services</small></div></div>
    <div id="nav"></div>
    <div class="sh" id="offH"></div>
    <div class="offs" id="offs"></div>
    <div class="sfoot"><a href="../ics/demo.html" target="_blank" id="siteLink"></a><button id="reset"></button><span>CRM demo by <a href="https://opensite.gr">OpenSite</a></span></div>
  </aside>
  <div class="main">
    <div class="top">
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <div class="search" id="searchBtn">⌕ <span id="searchT"></span><kbd>Ctrl K</kbd></div>
      <div class="lang" id="lang"><button data-l="en" class="on">EN</button><button data-l="el">ΕΛ</button><button data-l="fr">FR</button></div>
      <button class="bell" id="bell" aria-label="Notifications">🔔<em id="bellN"></em></button>
      <div class="me"><span class="av" id="meAv"></span><select id="meSel" aria-label="Current user"></select></div>
      <button class="new" id="newBtn">+ <span id="newT"></span></button>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<div class="ov" id="ov"></div>
<div class="card modal" id="modal"></div>
<div class="card modal palette" id="pal"><input id="palIn" autocomplete="off"><div class="pres" id="palRes"></div></div>
<div class="card pop" id="pop"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"><button id="tipX">×</button><b id="tipH"></b><span id="tipB"></span></div>
<div class="login" id="login"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const {OFF,U,TYPES,DOCST,KINDS,ROLES}=ICS;
const qs=new URLSearchParams(location.search);
if(qs.has('clean'))document.documentElement.classList.remove('notes');

function login(){let skip=qs.has('nologin');try{skip=skip||sessionStorage.getItem('ics-in')==='1'}catch(e){}
 const el=$('#login');if(skip){el.remove();return}
 const step1=()=>{el.innerHTML=`<div class="card"><div class="brand" style="color:var(--ink);padding:0"><i>ICS</i><div>Workspace<small style="color:var(--muted)">Integrated Consulting Services</small></div></div><h1>${T('Sign in','Σύνδεση','Connexion')}</h1><p class="muted">${T('Staff access for all six offices.','Πρόσβαση προσωπικού για τα έξι γραφεία.','Accès du personnel des six bureaux.')}</p><form class="fm" id="lf" style="margin-top:16px"><label>Email<input value="marianna@icsgr.com" required></label><label>${T('Password','Κωδικός','Mot de passe')}<input type="password" value="demo-password" required></label><button class="btn g" style="justify-content:center;padding:12px">${T('Continue','Συνέχεια','Continuer')}</button></form><div class="foot">🔒 ${T('Two-step sign-in · hosted in the EU · every action logged','Σύνδεση σε δύο βήματα · φιλοξενία στην ΕΕ · καταγραφή ενεργειών','Connexion en deux étapes · hébergé dans l’UE · actions journalisées')}</div><div class="lang" style="margin-top:14px;width:max-content">${['en','el','fr'].map(l=>`<button data-ll="${l}" class="${L===l?'on':''}">${l==='el'?'ΕΛ':l.toUpperCase()}</button>`).join('')}</div></div>`;
  $('#lf').onsubmit=e=>{e.preventDefault();step2()};$$('[data-ll]').forEach(b=>b.onclick=()=>{setLang(b.dataset.ll);step1()})};
 const step2=()=>{el.innerHTML=`<div class="card"><div class="brand" style="color:var(--ink);padding:0"><i>ICS</i><div>Workspace</div></div><h1>${T('Enter your code','Κωδικός επιβεβαίωσης','Entrez votre code')}</h1><p class="muted">${T('We sent a 6-digit code to your phone ending in ••42.','Στείλαμε 6ψήφιο κωδικό στο κινητό που λήγει σε ••42.','Nous avons envoyé un code à 6 chiffres au téléphone se terminant par ••42.')}</p><form id="cf2"><div class="codes">${'482913'.split('').map(d=>`<input maxlength="1" value="${d}">`).join('')}</div><button class="btn g" style="width:100%;justify-content:center;padding:12px;margin-top:12px">${T('Verify & sign in','Επιβεβαίωση & σύνδεση','Vérifier et se connecter')}</button></form><div class="foot">${T('Demo: the code is filled in for you.','Demo: ο κωδικός είναι ήδη συμπληρωμένος.','Démo : le code est déjà rempli.')}</div></div>`;
  $('#cf2').onsubmit=e=>{e.preventDefault();try{sessionStorage.setItem('ics-in','1')}catch(x){}el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),300)}};
 step1()}

/* ---------- live sync with the website ---------- */
const applyPerms=()=>{Object.entries(S.perms||{}).forEach(([id,p])=>{if(U[id])U[id].perm=p})};
applyPerms();
ICS.on(ns=>{const before=S;S=ns;applyPerms();
 const newIn=S.inbox.filter(x=>!before.inbox.some(y=>y.id===x.id));newIn.forEach(x=>x.fresh=true);
 render();
 if(newIn.length){const x=newIn[0],k={quote:['New quote request from the website','Νέο αίτημα προσφοράς από το site','Nouvelle soumission du site'],booking:['New booking from the website','Νέο ραντεβού από το site','Nouveau rendez-vous du site'],newsletter:['New newsletter sign-up','Νέα εγγραφή στο newsletter','Nouvelle inscription à l’infolettre'],upload:['A client uploaded a document','Πελάτης ανέβασε έγγραφο','Un client a téléversé un document'],message:['New message from a client','Νέο μήνυμα από πελάτη','Nouveau message d’un client'],payment:['Payment received online','Πληρωμή online','Paiement reçu en ligne']}[x.kind];
  toast('● '+tr(k)+(x.d.name?' · '+x.d.name:'')+' →',true,()=>go(x.kind==='upload'||x.kind==='message'||x.kind==='payment'?'case':'inbox',x.d.case))}});

/* ---------- chrome events ---------- */
function setLang(l){L=l;try{localStorage.setItem('ics-lang',l)}catch(e){}render()}
$('#lang').onclick=e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.l)};
$('#meSel').onchange=e=>{S.me=e.target.value;save();go('home');toast(T('You are now ','Είστε τώρα ','Vous êtes maintenant ')+U[S.me].n+' · '+offN(U[S.me].off))};
$('#burger').onclick=()=>$('#side').classList.toggle('on');
$('#reset').onclick=()=>{if(!confirm(T('Reset all demo data?','Επαναφορά όλων των δεδομένων;','Réinitialiser toutes les données ?')))return;S=ICS.reset();Object.keys(U).forEach(id=>U[id].perm={am:'admin',et:'admin',md:'office',sr:'acct',gt:'office'}[id]||'all');go('home');toast(T('Demo data reset','Τα δεδομένα επανήλθαν','Données réinitialisées'))};
$('#tipX').onclick=()=>$('#tip').remove();
setInterval(()=>{if(!document.hidden)chrome()},30000);
render();login();
</script>
</body>
</html>
