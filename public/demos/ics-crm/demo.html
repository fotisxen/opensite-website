<!doctype html>
<html lang="en" class="notes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1512">
<title>ICS Workspace · clients, cases & tasks</title>
<meta name="description" content="CRM demo for Integrated Consulting Services: client cards, cases with documents and properties, and tasks between the Toronto, Montreal, New York, Athens, Thessaloniki and Nicosia offices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  OpenSite CRM demo for Integrated Consulting Services (icsgr.com).
  Offices, phones, services and team names come from icsgr.com (Nov 2026). Clients, cases, documents and tasks are made up.
  Flow follows how the team works today: client card → case (project) with clients, documents, properties → tasks between offices.
  Everything runs in the browser and resets on reload. EN / ΕΛ with one tap. Switch user (top right) to see a task arrive in another office.
-->
<style>
:root{--bg:#f4f3ee;--card:#fff;--ink:#0f1512;--muted:#67716b;--lime:#9eaf00;--lime2:#eef3c4;--deep:#0f1512;--line:rgba(15,21,18,.1);
  --red:#c2410c;--amber:#b7791f;--green:#2f7d4f;--blue:#2459a8;--f:"Inter Tight",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh;height:100dvh}

/* sidebar */
.side{background:var(--deep);color:#d9dfda;display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font:700 18px/1 var(--f);color:#fff}
.brand i{width:30px;height:24px;border-radius:6px 6px 6px 0;background:var(--lime);display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;letter-spacing:1px}
.brand small{display:block;font:500 11px/1.2 var(--f);color:#8e9a92;margin-top:3px}
.nv{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;font-weight:500;color:#c4ccc6;text-align:left;width:100%}
.nv:hover{background:#1c2520}
.nv.on{background:#232e28;color:#fff}
.nv span{flex:1}
.nv em{font-style:normal;font-size:11.5px;font-weight:700;background:var(--lime);color:#10140a;border-radius:999px;padding:2px 7px}
.nv em.z{display:none}
.sh{font:600 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:#6f7b73;padding:16px 10px 6px}
.offs{display:grid;gap:2px}
.offs div{display:flex;justify-content:space-between;padding:6px 10px;font-size:12.5px;color:#9aa69f}
.offs b{color:#dfe5e0;font-weight:500}
.offs i{font-style:normal}
.offs .op::before{content:"● ";color:#7ccf8f}
.offs .cl::before{content:"● ";color:#59645d}
.sfoot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:#6f7b73}
.sfoot a{color:var(--lime)}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(244,243,238,.9);backdrop-filter:blur(10px)}
.burger{display:none;font-size:20px;padding:6px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:9px 12px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);cursor:text}
.search kbd{margin-left:auto;font:600 11px/1 var(--f);padding:3px 6px;border-radius:5px;background:#eeede7}
.lang{display:flex;background:#e6e5de;border-radius:9px;padding:3px}
.lang button{font:600 12px/1 var(--f);padding:7px 9px;border-radius:7px;color:var(--muted)}
.lang button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.me{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.me select{border:0;background:none;font-weight:600;max-width:190px;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--f);color:#fff;background:#38463e;flex:none}
.new{padding:10px 14px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;white-space:nowrap}
.view{flex:1;overflow:auto;padding:22px 20px 60px}
.h1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.h1 h1{font:600 26px/1.1 var(--f);letter-spacing:-.02em}
.h1 p{color:var(--muted);margin-top:4px}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 10px 30px -24px rgba(15,21,18,.35)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:9px;font-weight:600;background:var(--ink);color:#fff;white-space:nowrap}
.btn.l{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.g{background:var(--lime);color:#10140a}
.btn.s{padding:6px 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f);padding:5px 8px;border-radius:999px;background:#eeede7;color:#47524b;white-space:nowrap}
.pill.lime{background:var(--lime2);color:#4f5a00}
.pill.red{background:#fde7dc;color:var(--red)}
.pill.amber{background:#fbefd5;color:var(--amber)}
.pill.green{background:#dff1e5;color:var(--green)}
.pill.blue{background:#e2ebf8;color:var(--blue)}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* dashboard */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kp .card{padding:14px 16px}
.kp b{display:block;font:600 28px/1.1 var(--f);letter-spacing:-.02em}
.kp small{color:var(--muted)}
.dg{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.box{padding:16px}
.box h3{font:600 15px/1.2 var(--f);display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
@media(max-width:1100px){.dg{grid-template-columns:1fr}}
@media(max-width:700px){.kp{grid-template-columns:1fr 1fr}}

/* task rows */
.tr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.tr:first-of-type{border-top:0}
.tr:hover{background:#fafaf6}
.ck{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #b9bfb9;display:grid;place-items:center;color:#fff;font-size:12px;margin-top:1px}
.ck.on{background:var(--green);box-shadow:none}
.tr b{font-weight:600}
.tr .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center;font-size:12.5px;color:var(--muted)}
.tr.done b{text-decoration:line-through;color:var(--muted)}
.tr.fresh{animation:fr 2s}
@keyframes fr{0%{background:var(--lime2)}}
.due{font-size:12.5px;font-weight:600;white-space:nowrap}
.due.late{color:var(--red)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:8px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tabs button em{font-style:normal;margin-left:4px;font-size:12px;color:var(--muted)}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font:600 11.5px/1 var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#fafaf6}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block;color:var(--muted);font-size:12.5px}
.scroll{overflow:auto}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.flt input,.flt select{padding:9px 12px;border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff}

/* detail pages */
.back{display:inline-flex;gap:6px;color:var(--muted);font-weight:600;margin-bottom:10px}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.dh h1{font:600 24px/1.15 var(--f);letter-spacing:-.02em}
.dh .sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
.steps{display:flex;gap:4px;margin:4px 0 2px}
.steps button{flex:1;text-align:left;padding:9px 8px 7px;border-top:4px solid #dddcd4;font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.steps button.done{border-color:var(--lime);color:var(--ink)}
.steps button.cur{border-color:var(--ink);color:var(--ink)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:500;word-break:break-word}
.kv dd a{color:var(--blue)}
.chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);background:#fff;cursor:pointer}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip small{display:block;color:var(--muted);font-size:12.5px}
.chip .x{margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.doc{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.doc:first-of-type{border-top:0}
.doc .ic{width:30px;height:36px;border-radius:5px;background:#eeede7;display:grid;place-items:center;font:700 9px/1 var(--f);color:#6b736d}
.doc .ic.pdf{background:#fde7dc;color:var(--red)}
.doc select{border:0;background:#f4f3ee;border-radius:7px;padding:5px 6px;font-size:12.5px;font-weight:600}
.drop{margin-top:10px;padding:16px;border-radius:12px;border:1.5px dashed #c6cbc4;text-align:center;color:var(--muted);cursor:pointer;transition:all .2s}
.drop:hover,.drop.ov{border-color:var(--lime);background:var(--lime2);color:var(--ink)}
.prop{padding:12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);margin-top:8px;font-size:13.5px}
.prop b{font-size:14.5px}
.act{display:grid;gap:10px;font-size:13.5px}
.act div{display:grid;grid-template-columns:28px 1fr;gap:10px}
.act small{color:var(--muted)}
.note{width:100%;min-height:70px;padding:10px 12px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1px var(--line);resize:vertical}

/* modal + drawer */
.ov{position:fixed;inset:0;background:rgba(15,21,18,.35);z-index:80;display:none}
.ov.on{display:block}
.modal{position:fixed;left:50%;top:8vh;transform:translateX(-50%);width:min(560px,calc(100% - 24px));max-height:84vh;overflow:auto;z-index:81;display:none;padding:20px}
.modal.on{display:block}
.modal h2{font:600 19px/1.2 var(--f);margin-bottom:14px;display:flex;justify-content:space-between}
.fm{display:grid;gap:10px}
.fm label{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.fm input,.fm select,.fm textarea{padding:10px 12px;border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:#fff;color:var(--ink);font-weight:400;font-size:14.5px;min-width:0}
.fm .r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fm .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 11px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);font-weight:600;font-size:13px;background:#fff}
.seg button.on{background:var(--ink);color:#fff;box-shadow:none}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);background:#fff;z-index:81;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.drawer.on{transform:none}
.drawer .dhd{padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .dbd{padding:16px 20px;overflow:auto;flex:1}
.drawer .dft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.drawer .dft input{flex:1;min-width:0;padding:10px 12px;border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--line)}
.cm{display:grid;grid-template-columns:28px 1fr;gap:10px;margin-top:12px;font-size:13.5px}
.cm .bub{background:#f4f3ee;border-radius:4px 12px 12px 12px;padding:9px 11px}
.cm small{color:var(--muted)}
.palette{top:12vh;padding:0;overflow:hidden}
.palette input{width:100%;padding:16px 18px;border:0;border-bottom:1px solid var(--line);font-size:16px;outline:none}
.pres{max-height:55vh;overflow:auto;padding:6px}
.pres button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;text-align:left}
.pres button:hover,.pres button.sel{background:#f4f3ee}
.pres small{color:var(--muted);margin-left:auto;font-size:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:99;transition:transform .3s;max-width:calc(100% - 32px);font-size:14px}
.toast.on{transform:translate(-50%,0)}
.tip{position:fixed;right:16px;bottom:16px;z-index:70;max-width:300px;background:var(--lime2);color:#2d3300;border-radius:14px;padding:12px 14px;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.25)}
.tip b{display:block;margin-bottom:2px}
.tip button{position:absolute;top:6px;right:10px;font-size:16px;color:#5d6620}
html:not(.notes) .tip{display:none}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:85;transform:translateX(-100%);transition:transform .25s}
  .side.on{transform:none}
  .burger{display:block}
  .search kbd,.me select{display:none}
  .top{padding:10px 12px;gap:8px}
  .view{padding:16px 12px 60px}
  .tbl .hm{display:none}
  .fm .r2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i>ICS</i><div>Workspace<small>Integrated Consulting Services</small></div></div>
    <button class="nv" data-v="home"><span data-t="My day|Η μέρα μου">My day</span></button>
    <button class="nv" data-v="tasks"><span data-t="Tasks|Εργασίες">Tasks</span><em id="nTasks"></em></button>
    <button class="nv" data-v="cases"><span data-t="Cases|Υποθέσεις">Cases</span><em id="nCases" class="z"></em></button>
    <button class="nv" data-v="clients"><span data-t="Clients|Πελάτες">Clients</span></button>
    <div class="sh" data-t="Offices · now|Γραφεία · τώρα">Offices · now</div>
    <div class="offs" id="offs"></div>
    <div class="sfoot">CRM demo by <a href="https://opensite.gr">OpenSite</a> · <button id="reset" style="color:var(--lime)" data-t="reset data|επαναφορά">reset data</button></div>
  </aside>
  <div class="main">
    <div class="top">
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <div class="search" id="searchBtn">⌕ <span data-t="Search clients, cases, tasks…|Αναζήτηση πελατών, υποθέσεων, εργασιών…">Search clients, cases, tasks…</span><kbd>Ctrl K</kbd></div>
      <div class="lang"><button data-l="en" class="on">EN</button><button data-l="el">ΕΛ</button></div>
      <div class="me"><span class="av" id="meAv"></span><select id="meSel" aria-label="Current user"></select></div>
      <button class="new" id="newBtn">+ <span data-t="New|Νέο">New</span></button>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<div class="ov" id="ov"></div>
<div class="card modal" id="modal"></div>
<div class="card modal palette" id="pal"><input id="palIn" autocomplete="off"><div class="pres" id="palRes"></div></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<div class="tip" id="tip"><button id="tipX">×</button><b data-t="Try this|Δοκιμάστε">Try this</b><span data-t="Open a case → “+ Task” → send it to Athens. Then switch the user (top right) to Maria Korda: the task is waiting in her “My day”.|Ανοίξτε μια υπόθεση → «+ Εργασία» → στείλτε τη στην Αθήνα. Μετά αλλάξτε χρήστη (πάνω δεξιά) σε Maria Korda: η εργασία την περιμένει στη «Μέρα μου».">Open a case → “+ Task” → send it to Athens. Then switch the user (top right) to Maria Korda: the task is waiting in her “My day”.</span></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
if(location.search.includes('clean'))document.documentElement.classList.remove('notes');
let L='en';const T=(en,el)=>L==='el'?el:en;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000)};

/* ---------- reference data (offices & team from icsgr.com) ---------- */
const OFF={Toronto:{tz:'America/Toronto',el:'Τορόντο'},Montreal:{tz:'America/Toronto',el:'Μόντρεαλ'},'New York':{tz:'America/New_York',el:'Νέα Υόρκη'},Athens:{tz:'Europe/Athens',el:'Αθήνα'},Thessaloniki:{tz:'Europe/Athens',el:'Θεσσαλονίκη'},Nicosia:{tz:'Asia/Nicosia',el:'Λευκωσία'}};
const offN=o=>L==='el'?OFF[o].el:o;
const U={
 am:{n:'Anastasios Moussas',r:['President','Πρόεδρος'],off:'Toronto',c:'#0f1512'},
 mm:{n:'Marianna Michalitsianou',r:['Senior Consultant','Senior Consultant'],off:'Toronto',c:'#5b6b16'},
 md:{n:'Marie-Eve Duclos-Haskis',r:['Senior Consultant','Senior Consultant'],off:'Montreal',c:'#7a4b9b'},
 mk:{n:'Maria Korda',r:['Senior Consultant','Senior Consultant'],off:'Athens',c:'#2459a8'},
 ag:{n:'Anastasia Gianniloi',r:['Managing Lawyer','Δικηγόρος'],off:'Athens',c:'#a0522d'},
 sr:{n:'Stavroula Rigopoulou',r:['Accounting','Λογιστήριο'],off:'Athens',c:'#2f7d4f'},
 el:{n:'Eleonora Lekka',r:['Real Estate','Ακίνητα'],off:'Athens',c:'#b7791f'},
 gt:{n:'Georgios Tachtsidis',r:['Senior Consultant','Senior Consultant'],off:'Thessaloniki',c:'#c2410c'}};
const ini=n=>n.split(/[\s-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const av=(id,sz)=>{const u=U[id];return `<span class="av" style="background:${u?.c||'#38463e'}${sz?`;width:${sz}px;height:${sz}px`:''}" title="${esc(u?.n)}">${ini(u?.n||'?')}</span>`};
const TYPES={
 inh:{en:'Inheritance',el:'Κληρονομιά',c:'blue',steps:[['Consultation','Συζήτηση'],['Power of attorney','Πληρεξούσιο'],['Translations','Μεταφράσεις'],['Acceptance','Αποδοχή'],['Tax','Φόρος'],['Registration','Μεταγραφή']]},
 tax:{en:'Tax declaration',el:'Φορολογική',c:'green',steps:[['Documents','Έγγραφα'],['Preparation','Προετοιμασία'],['Review','Έλεγχος'],['Filed','Υποβλήθηκε']]},
 re:{en:'Real estate',el:'Ακίνητα',c:'amber',steps:[['Valuation','Εκτίμηση'],['Title check','Έλεγχος τίτλων'],['Buyer / tenant','Αγοραστής / ενοικιαστής'],['Contract','Συμβόλαιο'],['Closed','Ολοκληρώθηκε']]},
 tr:{en:'Translation',el:'Μετάφραση',c:'lime',steps:[['Received','Παραλαβή'],['Translating','Μετάφραση'],['Certified','Πιστοποίηση'],['Delivered','Παράδοση']]},
 bank:{en:'AFM & banking',el:'ΑΦΜ & τράπεζα',c:'',steps:[['Documents','Έγγραφα'],['AFM','ΑΦΜ'],['Bank account','Λογαριασμός'],['Done','Ολοκληρώθηκε']]},
 imm:{en:'Immigration',el:'Μετανάστευση',c:'red',steps:[['Eligibility','Καταλληλότητα'],['Application','Αίτηση'],['Decision','Απόφαση'],['Arrival','Άφιξη']]}};
const tName=k=>L==='el'?TYPES[k].el:TYPES[k].en;

 $('#n1').onclick=()=>newTask(R.v==='case'?R.id:undefined);$('#n2').onclick=()=>newCase();$('#n3').onclick=()=>newClient()};

/* ---------- command palette ---------- */
function openPal(){const p=$('#pal');p.classList.add('on');$('#ov').classList.add('on');const i=$('#palIn');i.value='';i.placeholder=T('Search clients, cases, tasks…','Αναζήτηση πελατών, υποθέσεων, εργασιών…');drawPal();setTimeout(()=>i.focus(),30)}
let PS=0,PR=[];
function drawPal(){const q=$('#palIn').value.toLowerCase();
 PR=[...S.clients.filter(c=>(c.n+c.ph.join()+c.em.join()+c.afm).toLowerCase().includes(q)).map(c=>['☺',c.n,T('Client','Πελάτης'),()=>go('client',c.id)]),
  ...S.cases.filter(c=>(c.id+c.t).toLowerCase().includes(q)).map(c=>['▣',c.id+' · '+c.t,tName(c.type),()=>go('case',c.id)]),
  ...S.tasks.filter(t=>!t.done&&t.t.toLowerCase().includes(q)).map(t=>['✓',t.t,U[t.to].n,()=>openTask(t.id)])].slice(0,12);PS=0;paintPal()}
function paintPal(){$('#palRes').innerHTML=PR.map((r,i)=>`<button class="${i===PS?'sel':''}" data-i="${i}"><span>${r[0]}</span><span>${esc(r[1])}</span><small>${esc(r[2])}</small></button>`).join('')||`<div class="empty">${T('Nothing found','Δεν βρέθηκε')}</div>`;
 $$('#palRes button').forEach(b=>b.onclick=()=>pick(+b.dataset.i))}
function pick(i){const r=PR[i];if(!r)return;closeAll();r[3]()}
$('#palIn').oninput=drawPal;$('#palIn').onkeydown=e=>{if(e.key==='ArrowDown'){PS=Math.min(PS+1,PR.length-1);paintPal();e.preventDefault()}if(e.key==='ArrowUp'){PS=Math.max(PS-1,0);paintPal();e.preventDefault()}if(e.key==='Enter')pick(PS)};
$('#searchBtn').onclick=openPal;

/* ---------- chrome ---------- */
$$('.nv').forEach(b=>b.onclick=()=>go(b.dataset.v));
$$('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;$$('.lang button').forEach(x=>x.classList.toggle('on',x===b));document.documentElement.lang=L==='el'?'el':'en';render()});
$('#meSel').onchange=e=>{S.me=e.target.value;save();go('home');toast(T('You are now ','Είστε τώρα ')+U[S.me].n+' · '+offN(U[S.me].off))};
$('#burger').onclick=()=>$('#side').classList.toggle('on');
$('#reset').onclick=()=>{S=SEED();save();go('home');toast(T('Demo data reset','Τα δεδομένα επανήλθαν'))};
$('#tipX').onclick=()=>$('#tip').remove();
setInterval(()=>{$('#offs').innerHTML=Object.keys(OFF).map(o=>{const t=tzNow(OFF[o].tz);return `<div class="${t.open?'op':'cl'}"><b>${offN(o)}</b><i>${t.s}</i></div>`}).join('')},30000);
render();
</script>
</body>
</html>
